<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodmeter – read the emotion in a sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --c { syntax: '<color>'; inherits: true; initial-value: #8c93b8; }
:root{
  --c:#8c93b8; --ink:#0d0f1f; --paper:#eceefc; --muted:#9aa0c4; --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.12);
  transition:--c 1.1s ease;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--ink);color:var(--paper);font:400 1rem/1.55 'DM Sans',system-ui,sans-serif;overflow-x:hidden;
  background-image:radial-gradient(90vmax 60vmax at 50% -10%, color-mix(in srgb,var(--c) 22%,transparent), transparent 70%);}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;left:0;top:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 65%);transform:translate(-50%,-50%);opacity:.7;filter:blur(20px)}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 22px 80px}
header{display:flex;align-items:center;gap:10px;font:700 1.05rem 'DM Sans';letter-spacing:.01em}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c)}
.status{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block}
.status.ok i{background:#4ade80;box-shadow:0 0 10px #4ade80}

.hero{text-align:center;padding:56px 0 30px;position:relative}
.orb{width:190px;height:190px;margin:0 auto 26px;position:relative;display:grid;place-items:center}
.orb::before,.orb::after{content:"";position:absolute;inset:0;background:var(--c)}
.orb::before{border-radius:46% 54% 58% 42%/48% 42% 58% 52%;animation:morph 9s ease-in-out infinite,spin 24s linear infinite;filter:blur(2px);box-shadow:0 0 90px color-mix(in srgb,var(--c) 70%,transparent)}
.orb::after{inset:14%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 55%);border-radius:50%;mix-blend-mode:soft-light}
.orb span{position:relative;z-index:2;font-size:4.2rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));transition:transform .4s}
.orb.pop span{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.orb.think::before{animation:morph 1.6s ease-in-out infinite,spin 3s linear infinite}
@keyframes morph{0%,100%{border-radius:46% 54% 58% 42%/48% 42% 58% 52%}33%{border-radius:58% 42% 40% 60%/56% 58% 42% 44%}66%{border-radius:42% 58% 52% 48%/40% 52% 48% 60%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
h1{font:700 clamp(2.1rem,6vw,3.7rem)/1.05 'Fraunces',Georgia,serif;letter-spacing:-.02em;max-width:14ch;margin:0 auto 14px}
.hero p{color:var(--muted);max-width:46ch;margin:0 auto}

.card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .6s,box-shadow .6s}
.card:focus-within{border-color:color-mix(in srgb,var(--c) 70%,white 10%);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 20px 60px -20px var(--c)}
textarea{width:100%;min-height:120px;resize:vertical;background:transparent;border:0;outline:0;color:var(--paper);font:500 1.25rem/1.5 'Fraunces',Georgia,serif;padding:6px}
textarea::placeholder{color:#6f759c}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.count{font-size:.8rem;color:var(--muted);min-width:64px;text-align:right;margin-left:auto}
button.go{position:relative;border:0;cursor:pointer;padding:13px 24px;border-radius:999px;font:700 1rem 'DM Sans';color:#0d0f1f;background:var(--c);overflow:hidden;transition:transform .2s,box-shadow .6s,background .6s;box-shadow:0 10px 30px -8px var(--c)}
button.go:hover{transform:translateY(-2px) scale(1.03)}
button.go:active{transform:scale(.97)}
button.go:disabled{opacity:.7;cursor:progress}
button.go .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

#err{display:none;margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(255,77,61,.12);border:1px solid rgba(255,77,61,.4);color:#ffb4aa;font-size:.92rem}

#result{display:none;margin-top:26px;grid-template-columns:240px 1fr;gap:26px;align-items:center}
#result.show{display:grid}
.verdict{text-align:center}
.ring{width:190px;height:190px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--c);stroke-dasharray:540;stroke-dashoffset:540;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1),stroke .8s;filter:drop-shadow(0 0 8px var(--c))}
.ring b{position:absolute;inset:0;display:grid;place-content:center;font:700 2.4rem 'Fraunces',serif}
.ring small{display:block;font:400 .8rem 'DM Sans';color:var(--muted);text-align:center;margin-top:-2px}
.verdict h2{font:700 2rem 'Fraunces',serif;margin-top:12px;text-transform:capitalize;color:var(--c);transition:color .8s}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:34px 86px 1fr 56px;align-items:center;gap:10px;font-size:.95rem;opacity:.65;transition:opacity .4s}
.bar.top{opacity:1;font-weight:700}
.bar .track{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:99px;background:var(--bc);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.top .pct{color:var(--paper)}

footer{margin-top:48px;text-align:center;color:#6f759c;font-size:.85rem}

@media(max-width:700px){#result.show{grid-template-columns:1fr}.bar{grid-template-columns:30px 76px 1fr 50px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="glow"></div>
<main>
  <header><span class="dot"></span>Moodmeter
    <div class="status" id="status"><i></i><span>Checking model…</span></div></header>

  <section class="hero">
    <div class="orb" id="orb"><span id="orbEmoji">🫧</span></div>
    <h1>What does this sentence feel like?</h1>
    <p>Type anything. A BiGRU network reads it and tells you which of six emotions it carries, and how sure it is.</p>
  </section>

  <section class="card">
    <textarea id="text" maxlength="2000" placeholder="I can't believe I finally got the offer…" aria-label="Sentence to analyse"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 2000</span>
      <button class="go" id="go">Read the emotion</button>
    </div>
    <div id="err" role="alert"></div>
  </section>

  <section id="result" aria-live="polite">
    <div class="verdict">
      <div class="ring">
        <svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="86"/><circle class="fg" id="arc" cx="100" cy="100" r="86"/></svg>
        <b><span id="conf">0%</span></b>
      </div>
      <small>confidence</small>
      <h2 id="label">joy</h2>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <footer>Moodmeter · FastAPI + Keras BiGRU</footer>
</main>

<script>
const EMO={
  sadness:{c:'#5b8def',e:'😢'}, joy:{c:'#ffc93c',e:'😁'}, love:{c:'#ff5d8f',e:'❤️'},
  anger:{c:'#ff4d3d',e:'😠'}, fear:{c:'#9b6bff',e:'😨'}, surprise:{c:'#2ee6c5',e:'😯'}
};
const ORDER=Object.keys(EMO);
const $=id=>document.getElementById(id);
const root=document.documentElement;

/* ---------- input ---------- */
function updateCount(){$('count').textContent=$('text').value.length+' / 2000'}
$('text').addEventListener('input',updateCount);
$('text').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')analyze()});

/* ---------- cursor glow ---------- */
const glow=$('glow');let gx=innerWidth/2,gy=innerHeight/3,tx=gx,ty=gy;
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY});
(function follow(){gx+=(tx-gx)*.08;gy+=(ty-gy)*.08;glow.style.left=gx+'px';glow.style.top=gy+'px';requestAnimationFrame(follow)})();

/* ---------- mood particles ---------- */
const cv=$('fx'),ctx=cv.getContext('2d');let W,H,mode='idle',parts=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const N=reduce?0:90;
function spawn(p,init){
  p.x=Math.random()*W;p.y=init?Math.random()*H:(mode==='sadness'?-10:H+10);
  p.r=Math.random()*2.4+.8;p.a=Math.random()*.5+.2;p.ph=Math.random()*6.28;
  if(mode==='surprise'){p.x=W/2;p.y=H/3;const a=Math.random()*6.28,s=Math.random()*4+1;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;return}
  p.vx=(Math.random()-.5)*.3;
  p.vy={idle:-.25,sadness:1.8,joy:-1.2,love:-.7,anger:-2.4,fear:-.1}[mode]*(Math.random()*.6+.7);
}
for(let i=0;i<N;i++){const p={};spawn(p,true);parts.push(p)}
function setMode(m){mode=m;parts.forEach(p=>spawn(p,true))}
let color='#8c93b8';
(function loop(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle=color;
  for(const p of parts){
    p.ph+=.03;
    if(mode==='love')p.x+=Math.sin(p.ph)*.6;
    if(mode==='fear'){p.x+=(Math.random()-.5)*2.2;p.y+=(Math.random()-.5)*2.2}
    if(mode==='anger')p.x+=(Math.random()-.5)*1.6;
    if(mode==='joy')p.x+=Math.sin(p.ph)*.4;
    p.x+=p.vx;p.y+=p.vy;
    if(mode==='sadness'){ctx.globalAlpha=p.a;ctx.fillRect(p.x,p.y,1.5,p.r*6)}
    else{ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(mode==='love'?1.6:1),0,6.28);ctx.fill()}
    if(p.y<-20||p.y>H+20||p.x<-20||p.x>W+20)spawn(p,false);
  }
  requestAnimationFrame(loop);
})();

function setMood(name){
  const c=name?EMO[name].c:'#8c93b8';color=c;
  root.style.setProperty('--c',c);setMode(name||'idle');
}

/* ---------- API ---------- */
fetch('/health').then(r=>r.json()).then(d=>{
  const s=$('status');s.classList.toggle('ok',d.model_loaded);
  s.querySelector('span').textContent=d.model_loaded?'Model ready':'Model loading…';
}).catch(()=>{$('status span').textContent='Server unreachable'});

function showError(m){const e=$('err');e.textContent=m;e.style.display='block'}
function ripple(e){
  const b=$('go'),r=document.createElement('span'),d=Math.max(b.offsetWidth,b.offsetHeight),rc=b.getBoundingClientRect();
  r.className='rip';r.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-rc.left-d/2}px;top:${e.clientY-rc.top-d/2}px`;
  b.appendChild(r);setTimeout(()=>r.remove(),650);
}
$('go').addEventListener('click',e=>{if(e.clientX)ripple(e);analyze()});

async function analyze(){
  const text=$('text').value.trim();$('err').style.display='none';
  if(!text){showError('Type a sentence first, then press Read the emotion.');$('text').focus();return}
  const btn=$('go');btn.disabled=true;btn.firstChild.textContent='Reading…';$('orb').classList.add('think');
  try{
    const res=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(res.status===503)throw new Error('The model is still loading. Wait a few seconds and try again.');
    if(!res.ok)throw new Error('The server returned an error ('+res.status+'). Check the sentence and try again.');
    render(await res.json());
  }catch(err){
    showError(err instanceof TypeError?'Could not reach the server. Check your connection and try again.':err.message);
  }finally{btn.disabled=false;btn.firstChild.textContent='Read the emotion';$('orb').classList.remove('think')}
}

/* ---------- render ---------- */
function countUp(el,to,ms=1200){
  const t0=performance.now();
  (function s(t){const k=Math.min((t-t0)/ms,1),v=to*(1-Math.pow(1-k,3));el.textContent=v.toFixed(1)+'%';if(k<1)requestAnimationFrame(s)})(t0);
}
function render(d){
  const top=d.predicted_emot,m=EMO[top];
  setMood(top);
  const orb=$('orb');$('orbEmoji').textContent=m.e;orb.classList.remove('pop');void orb.offsetWidth;orb.classList.add('pop');
  $('label').textContent=top;
  const r=$('result');r.classList.add('show');
  $('arc').style.strokeDashoffset=540;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('arc').style.strokeDashoffset=540*(1-d.confidence)}));
  countUp($('conf'),d.confidence*100);
  const bars=$('bars');bars.innerHTML='';
  ORDER.forEach(k=>{
    const p=(d.all_probab[k]||0)*100,row=document.createElement('div');
    row.className='bar'+(k===top?' top':'');row.style.setProperty('--bc',EMO[k].c);
    row.innerHTML=`<span>${EMO[k].e}</span><span>${k}</span><div class="track"><div class="fill"></div></div><span class="pct">${p.toFixed(1)}%</span>`;
    bars.appendChild(row);
    setTimeout(()=>row.querySelector('.fill').style.width=p+'%',80);
  });
  r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
